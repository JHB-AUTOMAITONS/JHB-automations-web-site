# Netlify deployment — JHB Automations monorepo (npm workspaces)
# Public website: apps/website (Next.js 15, SSR/ISR via the Netlify Next.js runtime).
#
# Base directory stays at the repo ROOT so `npm install` resolves the workspaces
# (incl. the local @jhb/shared package) before building. The @netlify/plugin-nextjs
# turns the build into serverless/edge functions so pages render on demand and ISR
# (app/layout.tsx `revalidate`) keeps admin edits live without a rebuild.

[build]
  command = "npm run build:website"
  publish = "apps/website/.next"

[build.environment]
  NODE_VERSION = "20"
  # REQUIRED — add these in Netlify -> Site -> Settings -> Environment variables
  # (they live in git-ignored .env.local, so they are NOT in the repo):
  #   NEXT_PUBLIC_SUPABASE_URL
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY
  #   REVALIDATE_SECRET  (long random string; set the SAME value on the admin site)
  # STATIC_EXPORT=true and NEXT_PUBLIC_SITE_URL come from the committed .env.production.
  #
  # REVALIDATE_SECRET powers the publish->live cache purge: right after a publish
  # the admin POSTs it to this site's /api/revalidate, so edits (incl. hidden
  # sections) appear immediately instead of after the ISR window. Keep it secret
  # (dashboard only, never committed). Without it, publishing still works but the
  # site refreshes on its normal ~30s ISR timer.

# Netlify's official Next.js runtime (SSR + ISR + image handling + redirects()).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# --- SEO 301 redirects (ported from the Apache .htaccess), run at the edge ---
#
# The "JHB HR Management System" page's URL is admin-editable (its public path
# is the "jhb-automation-tools" product's `href`, changed here via the admin's
# Product slug field) and has NO automatic redirect when it changes — by
# design, matching Vasool/Clinic/Operations' slug editing. It moved from
# /jhb-automation-tools to /hrms-software; every redirect below that used to
# target the old path now targets the new one, plus a dedicated redirect from
# the old path itself so existing bookmarks/search rankings aren't lost. If
# the slug is changed again in the admin, these three targets need updating
# by hand the same way (a known, accepted limitation of that feature).
[[redirects]]
  from = "/jhb-automation-tools"
  to = "/hrms-software/"
  status = 301
  force = true

[[redirects]]
  from = "/customer-relationship-management-software"
  to = "/hrms-software/"
  status = 301
  force = true

[[redirects]]
  from = "/services/customer-relationship-management-software"
  to = "/hrms-software/"
  status = 301
  force = true

[[redirects]]
  from = "/vasool-app"
  to = "/products/vasool-app/"
  status = 301
  force = true

[[redirects]]
  from = "/about-vasool"
  to = "/products/vasool-app/about/"
  status = 301
  force = true

# Deleted blog post still indexed by Google (returns 404 without this) — send
# searchers to the closest live equivalent instead of losing that traffic/equity.
[[redirects]]
  from = "/top-3-digital-marketing-agencies-in-salem"
  to = "/digital-marketing-in-salem/"
  status = 301
  force = true

[[redirects]]
  from = "/top-3-digital-marketing-agencies-in-salem/"
  to = "/digital-marketing-in-salem/"
  status = 301
  force = true
