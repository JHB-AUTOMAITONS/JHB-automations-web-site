# Netlify configuration for the JHB ADMIN DASHBOARD (apps/admin).
# This is a SEPARATE Netlify site from the public website.
#
# When you create the admin site in Netlify from this repo, set:
#   Site settings → Build & deploy → Base directory:  apps/admin
# Netlify then reads THIS file and (because the repo root package.json declares
# npm workspaces) installs the whole workspace so @jhb/shared resolves.
#
# Supabase env vars are committed in apps/admin/.env.production (they are public
# NEXT_PUBLIC values), so no Netlify dashboard env vars are required.
#
# DO NOT set STATIC_EXPORT here. The admin needs the cookie-aware Supabase client
# for login/sessions; STATIC_EXPORT makes it cookieless and would break auth.

[build]
  command = "npm run build"
  # No hardcoded `publish` — @netlify/plugin-nextjs auto-detects the .next output
  # from the Netlify "Package directory" (apps/admin). Hardcoding it double-nests
  # the path in this monorepo (e.g. apps/admin/apps/admin/.next) and 404s.

[build.environment]
  NODE_VERSION = "20"

# Netlify's official Next.js runtime — SSR, middleware (the auth gate) and ISR.
[[plugins]]
  package = "@netlify/plugin-nextjs"
